services:
  db:
    image: postgres:17-alpine
    restart: always
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      TZ: America/Bogota
    container_name: aura_grade_db
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  aura_grade_api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder # Usar la etapa de desarrollo se si definiera, pero por ahora builder es funcional
    container_name: aura_grade_dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      STATE: dev
      DB_HOST: db
      # Entre contenedores se usa siempre el puerto interno de PostgreSQL.
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      TZ: America/Bogota
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      PORT: ${PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_NAME: ${APP_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      AI_PROVIDER: ${AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      AUTH_ACCEPT_LEGACY_JWT: ${AUTH_ACCEPT_LEGACY_JWT:-true}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      SESSION_REMEMBER_IDLE_SECONDS: ${SESSION_REMEMBER_IDLE_SECONDS:-604800}
      SESSION_REMEMBER_ABSOLUTE_SECONDS: ${SESSION_REMEMBER_ABSOLUTE_SECONDS:-2592000}
      SESSION_ADMIN_IDLE_SECONDS: ${SESSION_ADMIN_IDLE_SECONDS:-900}
      SESSION_ADMIN_ABSOLUTE_SECONDS: ${SESSION_ADMIN_ABSOLUTE_SECONDS:-14400}
      SESSION_REFRESH_INTERVAL_SECONDS: ${SESSION_REFRESH_INTERVAL_SECONDS:-60}
      SESSION_MAX_PER_USER: ${SESSION_MAX_PER_USER:-5}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_CONFIRMATION_TEMPLATE_ID: ${RESEND_CONFIRMATION_TEMPLATE_ID}
      RESEND_UPDATE_PASSWORD_TEMPLATE_ID: ${RESEND_UPDATE_PASSWORD_TEMPLATE_ID}
      RESEND_RESET_PASSWORD_TEMPLATE_ID: ${RESEND_RESET_PASSWORD_TEMPLATE_ID}
    command: pnpm run start:dev

  redis:
    image: redis:7-alpine
    container_name: aura_grade_redis
    ports:
      - '${REDIS_PORT:-6379}:${REDIS_PORT:-6379}'
    restart: always
