services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      TZ: America/Bogota
    container_name: aura_grade_db_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aura_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  aura_grade_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura_grade:latest
    container_name: aura_grade_prod
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT}:${PORT}'
    environment:
      STATE: ${STATE:-prod}
      APP_NAME: ${APP_NAME}
      PORT: ${PORT}
      ## DB
      DB_HOST: db
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      TZ: America/Bogota
      ## JWT
      JWT_SECRET: ${JWT_SECRET}
      ## FRONTEND
      FRONTEND_URL: ${FRONTEND_URL}
      ## Cloudinary
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      ## AI
      AI_PROVIDER: ${AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ## Redis
      REDIS_URL: ${REDIS_URL}
      ## BFF
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      ## Auth
      AUTH_2FA_ENCRYPTION_KEY: ${AUTH_2FA_ENCRYPTION_KEY:-}
      AUTH_2FA_CHALLENGE_TTL_SECONDS: ${AUTH_2FA_CHALLENGE_TTL_SECONDS:-300}
      AUTH_2FA_MAX_ATTEMPTS: ${AUTH_2FA_MAX_ATTEMPTS:-5}
      AUTH_2FA_SESSION_TTL_SECONDS: ${AUTH_2FA_SESSION_TTL_SECONDS:-43200}
      ## Session
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      SESSION_REMEMBER_IDLE_SECONDS: ${SESSION_REMEMBER_IDLE_SECONDS:-604800}
      SESSION_REMEMBER_ABSOLUTE_SECONDS: ${SESSION_REMEMBER_ABSOLUTE_SECONDS:-2592000}
      SESSION_ADMIN_IDLE_SECONDS: ${SESSION_ADMIN_IDLE_SECONDS:-900}
      SESSION_ADMIN_ABSOLUTE_SECONDS: ${SESSION_ADMIN_ABSOLUTE_SECONDS:-14400}
      SESSION_REFRESH_INTERVAL_SECONDS: ${SESSION_REFRESH_INTERVAL_SECONDS:-60}
      SESSION_MAX_PER_USER: ${SESSION_MAX_PER_USER:-5}
      ## Institution
      BOOTSTRAP_INSTITUTION_NAME: ${BOOTSTRAP_INSTITUTION_NAME}
      BOOTSTRAP_INSTITUTION_SLUG: ${BOOTSTRAP_INSTITUTION_SLUG}
      BOOTSTRAP_INSTITUTION_EMAIL_DOMAIN: ${BOOTSTRAP_INSTITUTION_EMAIL_DOMAIN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME}
      BOOTSTRAP_ADMIN_DOCUMENT_NUM: ${BOOTSTRAP_ADMIN_DOCUMENT_NUM}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE}
      ## Vapid
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ## Resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_CONFIRMATION_TEMPLATE_ID: ${RESEND_CONFIRMATION_TEMPLATE_ID}
      RESEND_UPDATE_PASSWORD_TEMPLATE_ID: ${RESEND_UPDATE_PASSWORD_TEMPLATE_ID}
      RESEND_RESET_PASSWORD_TEMPLATE_ID: ${RESEND_RESET_PASSWORD_TEMPLATE_ID}
      RESEND_NEW_SUBMISSION_TEMPLATE_ID: ${RESEND_NEW_SUBMISSION_TEMPLATE_ID}
      RESEND_GRADE_PUBLISHED_TEMPLATE_ID: ${RESEND_GRADE_PUBLISHED_TEMPLATE_ID}
      RESEND_TASK_REMINDER_TEMPLATE_ID: ${RESEND_TASK_REMINDER_TEMPLATE_ID}
      RESEND_USER_INVITATION_TEMPLATE_ID: ${RESEND_USER_INVITATION_TEMPLATE_ID}
    networks:
      - aura_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:${PORT}/api/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: aura_grade_redis_prod
    restart: always
    networks:
      - aura_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

networks:
  aura_net:
    driver: bridge

volumes:
  postgres_data:
