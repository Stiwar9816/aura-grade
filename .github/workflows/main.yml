name: AuraGrade CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test -- --runInBand

      - name: Run Build (Verify compilation)
        run: pnpm run build

  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image for security analysis
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aura_grade:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Block critical and high vulnerabilities
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ secrets.DOCKERHUB_USERNAME }}/aura_grade:${{ github.sha }}
          only-severities: critical,high
          exit-code: true

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aura_grade:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aura_grade:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
