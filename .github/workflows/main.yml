name: AuraGrade CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aura_grade_ci
          POSTGRES_USER: aura_ci
          POSTGRES_PASSWORD: ci_database_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aura_ci -d aura_grade_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit --incremental false

      - name: Run tests including Redis integration
        env:
          RUN_REDIS_INTEGRATION: 'true'
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test --runInBand

      - name: Run Build (Verify compilation)
        run: pnpm run build

      - name: Verify migrations on an isolated PostgreSQL database
        env:
          STATE: prod
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: aura_grade_ci
          DB_USERNAME: aura_ci
          DB_PASSWORD: ci_database_only
          DB_SSL_MODE: disable
          BOOTSTRAP_INSTITUTION_NAME: CI Institution
          BOOTSTRAP_INSTITUTION_SLUG: ci-institution
          BOOTSTRAP_INSTITUTION_EMAIL_DOMAIN: example.test
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: CiFixtureOnly2026
          BOOTSTRAP_ADMIN_NAME: CI
          BOOTSTRAP_ADMIN_LAST_NAME: Administrator
          BOOTSTRAP_ADMIN_DOCUMENT_NUM: '987654321'
          BOOTSTRAP_ADMIN_PHONE: '3999999999'
        run: node scripts/check-migrations.cjs

  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate Sentry source map configuration
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN" || { echo "::error::Falta el secreto SENTRY_AUTH_TOKEN"; exit 1; }
          test -n "$SENTRY_ORG" || { echo "::error::Falta la variable SENTRY_ORG"; exit 1; }
          test -n "$SENTRY_PROJECT" || { echo "::error::Falta la variable SENTRY_PROJECT"; exit 1; }

      - name: Build image for security analysis
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aura_grade:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Block critical and high vulnerabilities
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ secrets.DOCKERHUB_USERNAME }}/aura_grade:${{ github.sha }}
          only-severities: critical,high
          exit-code: true

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_RELEASE=aura-grade@${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aura_grade:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aura_grade:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
